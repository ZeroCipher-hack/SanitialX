services:
  postgres:
    image: postgres:16-alpine
    container_name: sanitialx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanitialx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanitialx_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-sanitialx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanitialx} -d ${POSTGRES_DB:-sanitialx}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sanitialx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanitialx-migrate
    command: alembic upgrade head
    env_file:
      - ./backend/.env
    environment:
      SANITIALX_DATABASE_URL: ${SANITIALX_DATABASE_URL:-postgresql+asyncpg://sanitialx:sanitialx_password_change_me@postgres:5432/sanitialx}
      SANITIALX_API_KEY: ${SANITIALX_API_KEY:?SANITIALX_API_KEY must be set in .env}
      SANITIALX_JWT_SECRET_KEY: ${SANITIALX_JWT_SECRET_KEY:?SANITIALX_JWT_SECRET_KEY must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanitialx-backend
    restart: unless-stopped
    command: uvicorn main:create_app --factory --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    ports:
      - "${SANITIALX_API_PORT:-8000}:8000"
    environment:
      SANITIALX_APP_NAME: ${SANITIALX_APP_NAME:-SanitialX}
      SANITIALX_ENVIRONMENT: ${SANITIALX_ENVIRONMENT:-production}
      SANITIALX_LOG_LEVEL: ${SANITIALX_LOG_LEVEL:-INFO}
      SANITIALX_REDIS_URL: ${SANITIALX_REDIS_URL:-redis://redis:6379/0}
      SANITIALX_DATABASE_URL: ${SANITIALX_DATABASE_URL:-postgresql+asyncpg://sanitialx:sanitialx_password_change_me@postgres:5432/sanitialx}
      SANITIALX_API_HOST: 0.0.0.0
      SANITIALX_API_PORT: 8000
      SANITIALX_API_KEY: ${SANITIALX_API_KEY:?SANITIALX_API_KEY must be set in .env}
      SANITIALX_JWT_SECRET_KEY: ${SANITIALX_JWT_SECRET_KEY:?SANITIALX_JWT_SECRET_KEY must be set in .env}
      SANITIALX_JWT_ALGORITHM: ${SANITIALX_JWT_ALGORITHM:-HS256}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanitialx-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: python scripts/run_worker.py
    environment:
      SANITIALX_APP_NAME: ${SANITIALX_APP_NAME:-SanitialX}
      SANITIALX_ENVIRONMENT: ${SANITIALX_ENVIRONMENT:-production}
      SANITIALX_LOG_LEVEL: ${SANITIALX_LOG_LEVEL:-INFO}
      SANITIALX_REDIS_URL: ${SANITIALX_REDIS_URL:-redis://redis:6379/0}
      SANITIALX_DATABASE_URL: ${SANITIALX_DATABASE_URL:-postgresql+asyncpg://sanitialx:sanitialx_password_change_me@postgres:5432/sanitialx}
      SANITIALX_API_KEY: ${SANITIALX_API_KEY:?SANITIALX_API_KEY must be set in .env}
      SANITIALX_JWT_SECRET_KEY: ${SANITIALX_JWT_SECRET_KEY:?SANITIALX_JWT_SECRET_KEY must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  vulnerability-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanitialx-vulnerability-scheduler
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: python scripts/run_vulnerability_scheduler.py
    environment:
      SANITIALX_APP_NAME: ${SANITIALX_APP_NAME:-SanitialX}
      SANITIALX_ENVIRONMENT: ${SANITIALX_ENVIRONMENT:-production}
      SANITIALX_LOG_LEVEL: ${SANITIALX_LOG_LEVEL:-INFO}
      SANITIALX_DATABASE_URL: ${SANITIALX_DATABASE_URL:-postgresql+asyncpg://sanitialx:sanitialx_password_change_me@postgres:5432/sanitialx}
      SANITIALX_API_KEY: ${SANITIALX_API_KEY:?SANITIALX_API_KEY must be set in .env}
      SANITIALX_JWT_SECRET_KEY: ${SANITIALX_JWT_SECRET_KEY:?SANITIALX_JWT_SECRET_KEY must be set in .env}
      SANITIALX_VULNERABILITY_SYNC_INTERVAL_SECONDS: ${SANITIALX_VULNERABILITY_SYNC_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Low-interaction honeypot decoys. Opt-in only:
  #   docker compose --profile honeypot up -d honeypot
  # A decoy logs attacker connections (never executes input); the hits become
  # the local "under active attack" signal that boosts matching exposures.
  honeypot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanitialx-honeypot
    restart: unless-stopped
    profiles: ["honeypot"]
    env_file:
      - ./backend/.env
    command: python scripts/run_honeypot.py
    ports:
      - "${SANITIALX_HONEYPOT_SSH_PORT:-2222}:2222"
      - "${SANITIALX_HONEYPOT_WEB_PORT:-8080}:8080"
      - "${SANITIALX_HONEYPOT_TELNET_PORT:-2323}:2323"
    environment:
      SANITIALX_ENVIRONMENT: ${SANITIALX_ENVIRONMENT:-production}
      SANITIALX_LOG_LEVEL: ${SANITIALX_LOG_LEVEL:-INFO}
      SANITIALX_DATABASE_URL: ${SANITIALX_DATABASE_URL:-postgresql+asyncpg://sanitialx:sanitialx_password_change_me@postgres:5432/sanitialx}
      SANITIALX_API_KEY: ${SANITIALX_API_KEY:?SANITIALX_API_KEY must be set in .env}
      SANITIALX_JWT_SECRET_KEY: ${SANITIALX_JWT_SECRET_KEY:?SANITIALX_JWT_SECRET_KEY must be set in .env}
      SANITIALX_HONEYPOT_ENABLED: "true"
      SANITIALX_HONEYPOT_HOST: "0.0.0.0"
      SANITIALX_HONEYPOT_PORTS: ${SANITIALX_HONEYPOT_PORTS:-2222:SSH,8080:Fake Web Panel,2323:Telnet}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
