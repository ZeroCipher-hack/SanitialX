version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: sanitialx-postgres-test
    environment:
      POSTGRES_USER: sanitialx
      POSTGRES_PASSWORD: sanitialx_test_password
      POSTGRES_DB: sanitialx_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanitialx -d sanitialx_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: sanitialx-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
