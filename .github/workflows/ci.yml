name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SENTINELX_API_KEY: ci-test-api-key
      SENTINELX_JWT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. python -m pytest tests -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx_ci_password
          POSTGRES_DB: sentinelx
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinelx -d sentinelx"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      SENTINELX_API_KEY: ci-test-api-key
      SENTINELX_JWT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SENTINELX_DATABASE_URL: postgresql+asyncpg://sentinelx:sentinelx_ci_password@localhost:5432/sentinelx
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Upgrade database to Alembic head
        run: alembic upgrade head

      - name: Verify Alembic current revision
        run: alembic current

  linux-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile Linux agent
        run: python -m py_compile sanitialx_agent.py

      - name: Run Linux agent collector tests
        run: python -m unittest -v test_sanitialx_agent.py

  windows-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell agent
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './SanitialX-Agent.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build
